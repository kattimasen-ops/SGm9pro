name: Build Smokin' Guns (RK3326 / ARM64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aarch64:
    # [FIX] Nativer ARM64-Runner statt QEMU-Emulation.
    # Kein Docker, kein QEMU, keine Plattform-Warnungen.
    # Verfuegbar fuer oeffentliche Repositories.
    runs-on: ubuntu-24.04-arm

    env:
      # Cortex-A35 Performance-Flags (RK3326 Quad-Core, ARMv8-A 64-bit)
      OPTIMIZE: "-O2 -pipe -mcpu=cortex-a35 -mtune=cortex-a35 -fomit-frame-pointer -fno-math-errno -fno-trapping-math -fno-stack-protector -fmerge-all-constants -DNDEBUG"
      LDFLAGS: "-Wl,-O1 -Wl,--as-needed"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Abhaengigkeiten installieren
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            g++ \
            make \
            ccache \
            python3 \
            libsdl1.2-dev \
            libopenal-dev \
            libcurl4-openssl-dev \
            libvorbis-dev \
            libogg-dev \
            libfreetype6-dev \
            libpng-dev \
            zlib1g-dev
          which sdl-config && sdl-config --version

      - name: Patches anwenden
        run: |
          pwd
          ls -la
          python3 patch_arm64.py

      - name: Smokin' Guns kompilieren
        run: |
          make USE_SDL2=0 ARCH=aarch64 PLATFORM=linux -j$(nproc) release \
            OPTIMIZE="$OPTIMIZE" \
            LDFLAGS="$LDFLAGS"

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: smokinguns-rk3326-aarch64
          path: build/release-linux-aarch64/
