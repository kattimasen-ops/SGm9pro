name: Baue Smokin' Guns (RK3326 / ARM64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# [FIX] Explizite Berechtigungen fuer GHCR-Caching der run-on-arch-action.
# Ohne packages: write verweigert GitHub den Push des Cache-Images und
# der Container startet anschliessend ohne root-Rechte (apt-lock-Fehler).
permissions:
  contents: read
  packages: write

jobs:
  build-aarch64:
    runs-on: ubuntu-latest

    env:
      # Cortex-A35 Performance-Flags (RK3326 Quad-Core, ARMv8-A 64-bit)
      # -O2 ist der etablierte, sichere Standard fuer die ioquake3-Engine.
      OPTIMIZE: "-O2 -pipe -mcpu=cortex-a35 -mtune=cortex-a35 -fomit-frame-pointer -fno-math-errno -fno-trapping-math -fno-stack-protector -fmerge-all-constants -DNDEBUG"
      LDFLAGS: "-Wl,-O1 -Wl,--as-needed"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build in Ubuntu 20.04 ARM64-Umgebung ausfuehren
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          # Ubuntu 20.04 sichert die GLIBC 2.31 Kompatibilitaet fuer RK3326 OS
          distro: ubuntu20.04
          # [FIX] githubToken wird jetzt mit packages:write-Berechtigung
          # verwendet (siehe permissions-Block oben). Damit funktioniert
          # das GHCR-Caching und der Container startet mit root-Rechten.
          githubToken: ${{ github.token }}

          setup: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential \
              gcc \
              g++ \
              make \
              ccache \
              python3 \
              libsdl1.2-dev \
              libopenal-dev \
              libcurl4-openssl-dev \
              libvorbis-dev \
              libogg-dev \
              libfreetype6-dev \
              libpng-dev \
              zlib1g-dev
            which sdl-config && sdl-config --version

          run: |
            python3 patch_arm64.py
            make USE_SDL2=0 ARCH=aarch64 PLATFORM=linux -j$(nproc) release \
              OPTIMIZE="$OPTIMIZE" \
              LDFLAGS="$LDFLAGS"

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: smokinguns-rk3326-aarch64
          path: build/release-linux-aarch64/
