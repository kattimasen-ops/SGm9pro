name: "Build Smokin Guns PortMaster (RK3326 / ArkOS)"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-portmaster:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up QEMU for ARM64 Emulation"
        uses: docker/setup-qemu-action@v3

      - name: "Create ARM64 Build Script"
        run: |
          cat << 'EOF' > build_arm64.sh
          #!/bin/bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          echo "==> Updating packages and installing ARM64 build tools..."
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential cmake git zip pkg-config ca-certificates \
            libsdl2-dev libopenal-dev libcurl4-openssl-dev \
            libgl1-mesa-dev libgles2-mesa-dev libgbm-dev

          echo "==> Building GL4ES for Mali-G31 GPU..."
          git clone --depth 1 https://github.com/ptitSeb/gl4es.git
          cd gl4es && mkdir build && cd build
          cmake .. \
            -DNOX11=ON \
            -DGLX_STUBS=ON \
            -DEGL_WRAPPER=ON \
            -DGBM=ON \
            -DSTATICLIB=OFF
          make -j$(nproc)
          cd /workspace

          echo "==> Cloning Smokin Guns engine source..."
          git clone --depth 1 https://github.com/smokin-guns/SmokinGuns.git engine-src
          cd engine-src

          echo "==> Compiling engine for RK3326 (Cortex-A35)..."
          make -j$(nproc) \
            ARCH=aarch64 \
            USE_OPENAL=1 \
            USE_OPENAL_DLOPEN=1 \
            USE_CURL=1 \
            USE_CURL_DLOPEN=1 \
            USE_CODEC_VORBIS=1 \
            OPTIMIZE="-O2 -march=armv8-a -mcpu=cortex-a35 -mtune=cortex-a35 -pipe -fomit-frame-pointer -ffast-math" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0
          EOF
          chmod +x build_arm64.sh

      - name: "Execute Build in Ubuntu 20.04 ARM64 Container"
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            arm64v8/ubuntu:20.04 ./build_arm64.sh

      - name: "Package PortMaster Artifacts and Scripts"
        run: |
          set -euo pipefail

          mkdir -p release/smokinguns/libs.aarch64
          mkdir -p release/smokinguns/smokinguns

          BIN_FILE=$(find engine-src/build -type f \( -name "smokinguns.aarch64" -o -name "ioquake3.aarch64" -o -name "smokinguns" \) | head -n 1)
          if [ -z "$BIN_FILE" ]; then
            echo "ERROR: Binary not found in engine-src/build!"
            exit 1
          fi
          cp "$BIN_FILE" release/smokinguns/smokinguns.aarch64
          chmod +x release/smokinguns/smokinguns.aarch64

          find engine-src/build -name "*.so" -exec cp {} release/smokinguns/smokinguns/ \; || true
          cp gl4es/lib/libGL.so.1 release/smokinguns/libs.aarch64/

          # 1. Generate Launch Script
          cat << 'EOF' > "release/Smokin Guns.sh"
#!/bin/bash
XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}

if [ -d "/opt/system/Tools/PortMaster/" ]; then
  CONTROL_FOLDER="/opt/system/Tools/PortMaster"
elif [ -d "/opt/tools/PortMaster/" ]; then
  CONTROL_FOLDER="/opt/tools/PortMaster"
elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
  CONTROL_FOLDER="$XDG_DATA_HOME/PortMaster"
else
  CONTROL_FOLDER="/roms/ports/PortMaster"
fi

source $CONTROL_FOLDER/control.txt
[ -f "${CONTROL_FOLDER}/mod_script.sh" ] && source "${CONTROL_FOLDER}/mod_script.sh"
get_controls

GAMEDIR="/$DIRECTORY/ports/smokinguns"
cd $GAMEDIR

$ESUDO chmod +x $GAMEDIR/smokinguns.aarch64

export LD_LIBRARY_PATH="$GAMEDIR/libs.aarch64:$LD_LIBRARY_PATH"
export LIBGL_ES=2
export LIBGL_GL=21
export LIBGL_FB=4
export LIBGL_DEFAULT_FBO=1

$GPTOKEYB "smokinguns.aarch64" -c "$GAMEDIR/smokinguns.gptk" &

./smokinguns.aarch64 \
  +set r_customwidth $DISPLAY_WIDTH \
  +set r_customheight $DISPLAY_HEIGHT \
  +set r_mode -1 \
  +set r_fullscreen 1 \
  +set r_swapInterval 1 \
  +set s_useOpenAL 1 \
  +set com_hunkMegs 256

$ESUDO killall gptokeyb
EOF
          chmod +x "release/Smokin Guns.sh"

          # 2. Generate GPToKeyB Input Config
          cat << 'EOF' > release/smokinguns/smokinguns.gptk
back = esc
start = enter
a = space
b = leftctrl
x = r
y = e
l1 = mouse_right
r1 = mouse_left
up = w
down = s
left = a
right = d
left_analog_up = w
left_analog_down = s
left_analog_left = a
left_analog_right = d
right_analog_up = mouse_movement_up
right_analog_down = mouse_movement_down
right_analog_left = mouse_movement_left
right_analog_right = mouse_movement_right
deadzone = 4000
EOF

          # 3. Generate Port Metadata
          cat << 'EOF' > release/smokinguns/port.json
{
  "version": 1,
  "name": "smokinguns.zip",
  "items": [
    "Smokin Guns.sh",
    "smokinguns"
  ],
  "items_opt": [],
  "attr": {
    "title": "Smokin Guns",
    "desc": "Western FPS powered by ioquake3 engine.",
    "inst": "Copy game PK3 files into ports/smokinguns/smokinguns/",
    "author": "Smokin Guns Team",
    "porter": "Custom",
    "category": "fps",
    "runtimes": [],
    "reqs": []
  }
}
EOF

          # 4. Generate README
          cat << 'EOF' > release/smokinguns/README.md
# Smokin Guns PortMaster Build for M9 Pro (RK3326)

## Setup Instructions
1. Unzip the artifact into `/roms/ports/`.
2. Place the game's official assets (`.pk3` files) into `/roms/ports/smokinguns/smokinguns/`.
3. Launch `Smokin Guns.sh` from the Ports menu.
EOF

          # Zip everything up into final PortMaster package
          cd release
          zip -r ../SmokinGuns-PortMaster-RK3326.zip "Smokin Guns.sh" smokinguns/

      - name: "Upload Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: SmokinGuns-PortMaster-RK3326
          path: SmokinGuns-PortMaster-RK3326.zip
          if-no-files-found: error
