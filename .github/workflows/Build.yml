name: Baue Smokin' Guns (RK3326 / ARM64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-aarch64:
    runs-on: ubuntu-latest

    env:
      OPTIMIZE: "-O2 -pipe -mcpu=cortex-a35 -mtune=cortex-a35 -fomit-frame-pointer -fno-math-errno -fno-trapping-math -fno-stack-protector -fmerge-all-constants -DNDEBUG"
      LDFLAGS: "-Wl,-O1 -Wl,--as-needed"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build in Ubuntu 20.04 ARM64-Umgebung ausfuehren
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu20.04
          githubToken: ${{ github.token }}
          # [FIX] Container explizit als root starten, damit apt-get update
          # im setup-Block die Lock-Dateien oeffnen kann.
          dockerRunArgs: --user root

          setup: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential \
              gcc \
              g++ \
              make \
              ccache \
              python3 \
              libsdl1.2-dev \
              libopenal-dev \
              libcurl4-openssl-dev \
              libvorbis-dev \
              libogg-dev \
              libfreetype6-dev \
              libpng-dev \
              zlib1g-dev
            which sdl-config && sdl-config --version

          run: |
            python3 patch_arm64.py
            make USE_SDL2=0 ARCH=aarch64 PLATFORM=linux -j$(nproc) release \
              OPTIMIZE="$OPTIMIZE" \
              LDFLAGS="$LDFLAGS"

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: smokinguns-rk3326-aarch64
          path: build/release-linux-aarch64/
