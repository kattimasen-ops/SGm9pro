name: Create Smokin' Guns for RK3326 (PortMaster) - MAXIMUM Performance Native Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-smokinguns.yml'

permissions:
  contents: read

env:
  ZIP_NAME: SmokinGuns-PortMaster-RK3326-Native-SDL12-Max.zip
  PORT_DIR: smokinguns

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zip utility
        run: sudo apt-get update -y && sudo apt-get install -y zip

      - name: Set up QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Write patch script into work directory
        run: |
          mkdir -p work
          cat <<'PY_EOF' > work/patch_arm64.py
          #!/usr/bin/env python3
          import os, sys, re

          def patch_makefile():
              makefile = "Makefile"
              if not os.path.exists(makefile):
                  print(f"[ERROR] {makefile} not found!")
                  sys.exit(1)
              with open(makefile, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              content = re.sub(r'RENDERER_GL2\s*=\s*[^\n]*\n', 'RENDERER_GL2 =\n', content)
              lines = content.splitlines(keepends=True)
              new_lines = []
              for line in lines:
                  if 'renderergl2' in line and ('BUILD_' in line or 'TARGET' in line or 'RENDERER' in line):
                      new_lines.append('# [PATCHED] Disabled renderergl2: ' + line)
                      continue
                  new_lines.append(line)
              content = "".join(new_lines)
              content = re.sub(r'^\$\(B\)/renderergl2/[^\n]*\n', '', content, flags=re.MULTILINE)
              content = re.sub(r'-Werror[a-zA-Z0-9=-]*', '', content)
              content = re.sub(r'-Wmaybe-uninitialized', '', content)
              content = re.sub(r'-Wuninitialized', '', content)
              content = re.sub(r'-Wstrict-overflow', '', content)
              content = re.sub(r'\brm\s+(?!-)', 'rm -f ', content)
              content = content.replace('//ui/', '/ui/')
              content = content.replace('//game/', '/game/')
              content = content.replace('//cgame/', '/cgame/')
              content = content.replace('python ', 'python3 ')
              content = content.replace('python2 ', 'python3 ')
              if not re.search(r'ARCH_STRING\s*=', content):
                  content = re.sub(r'(ARCH\s*=\s*[^\n]*\n)', r'\1ARCH_STRING = aarch64\n', content, count=1)
              content = re.sub(r'(?<!\w)-O2(?!\w)', '-O3', content)
              if '-fno-plt' not in content:
                  content = re.sub(r'(OPTIMIZE\s*=\s*[^\n]*)', r'\1 -fno-plt', content, count=1)
              with open(makefile, "w", encoding="utf-8") as f:
                  f.write(content)
              print("[PATCHED] Makefile: renderergl2 deaktiviert, rm -f, python3, O3, fno-plt.")

          def patch_q_platform():
              path = "code/qcommon/q_platform.h"
              if not os.path.exists(path):
                  print(f"[ERROR] {path} not found!")
                  sys.exit(1)
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              if re.search(r'ARCH_STRING\s+"aarch64"', content):
                  print("[INFO] q_platform.h bereits gepatcht.")
                  return
              if '__aarch64__' in content and 'ARCH_STRING' in content:
                  if re.search(r'__aarch64__.*?ARCH_STRING', content, re.DOTALL):
                      print("[INFO] q_platform.h behandelt __aarch64__ bereits.")
                      return
              aarch64_override = (
                  "/* [PATCHED] ARM64 ARCH_STRING Override */\n"
                  "#if defined(__aarch64__) || defined(__arm64__) || defined(aarch64)\n"
                  "#ifdef ARCH_STRING\n"
                  "#undef ARCH_STRING\n"
                  "#endif\n"
                  "#define ARCH_STRING \"aarch64\"\n"
                  "#ifndef Q3_LITTLE_ENDIAN\n"
                  "#define Q3_LITTLE_ENDIAN\n"
                  "#endif\n"
                  "#endif\n\n"
              )
              content = aarch64_override + content
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("[PATCHED] ARCH_STRING 'aarch64' in q_platform.h injiziert.")

          if __name__ == "__main__":
              patch_makefile()
              patch_q_platform()
              print("[DONE] Alle Patches erfolgreich angewendet.")
          PY_EOF

      - name: Write in-container build script
        run: |
          mkdir -p work/src work/out/game work/out/libs.aarch64
          cat <<'BUILD_SCRIPT_EOF' > work/build.sh
          #!/bin/bash
          set -euo pipefail
          set -x
          export DEBIAN_FRONTEND=noninteractive

          # =====================================================================
          # OPTIMIERUNG: Cortex-A35 gezielt, LTO deaktiviert (ARM64-Segfaults),
          # -fno-plt fuer schnellere PLT-Aufrufe, -fno-exceptions/-rtti fuer C++
          # =====================================================================
          export OPTIMIZE="-O3 -mcpu=cortex-a35 -mtune=cortex-a35 -pipe -fomit-frame-pointer -ffast-math -ftree-vectorize -fno-semantic-interposition -fno-plt -fno-exceptions -fno-rtti -DNDEBUG -w"
          export LDFLAGS="-Wl,-O1 -Wl,--as-needed"

          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git pkg-config ca-certificates wget file zip python3 ccache \
            libsdl1.2-dev libsdl2-dev \
            libfreetype6-dev libjpeg-dev libpng-dev zlib1g-dev \
            libogg-dev libvorbis-dev libopus-dev libopusfile-dev \
            libcurl4-openssl-dev libopenal-dev libspeex-dev \
            libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev \
            libx11-dev libxext-dev libgl1-mesa-dev libglu1-mesa-dev \
            autoconf automake libtool
          git config --global --add safe.directory '*'

          ccache -M 2G
          export CC="ccache gcc"
          export CXX="ccache g++"

          CMAKE_VERSION=3.28.3
          wget -q "https://cmake.org/files/v3.28/cmake-${CMAKE_VERSION}-linux-aarch64.tar.gz" -O /tmp/cmake.tar.gz
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          export PATH="/opt/cmake/bin:$PATH"

          # =====================================================================
          # SCHRITT 1: GL4ES bauen (OpenGL -> OpenGL ES 2.0 Uebersetzung)
          # =====================================================================
          cd /work/src
          if [ ! -d gl4es ]; then git clone --depth=1 https://github.com/ptitSeb/gl4es.git; fi
          cd gl4es
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$OPTIMIZE" \
            -DNOX11=ON -DGLX_STUBS=ON -DEGL_WRAPPER=ON -DGBM=ON \
            -DSTATICLIB=OFF -DDEFAULT_ES=2 -DNOERROR=ON
          make -j"$(nproc)"

          cp "$(find /work/src/gl4es -name 'libGL.so.1' -print -quit)" /work/out/libs.aarch64/libGL.so.1
          cp "$(find /work/src/gl4es -name 'libEGL.so.1' -print -quit)" /work/out/libs.aarch64/libEGL.so.1

          # =====================================================================
          # SCHRITT 2: NATIVE SDL 1.2 Bibliothek fuer ARM64 bauen
          # ANSTATT sdl12-compat (KEINE SDL1->SDL2 Uebersetzung!)
          # Branch ist "main", nicht "SDL-1.2"
          # =====================================================================
          cd /work/src
          if [ ! -d SDL-1.2 ]; then
            git clone --depth=1 https://github.com/libsdl-org/SDL-1.2.git
          fi
          cd SDL-1.2

          # autogen.sh ausfuehren, um configure zu erzeugen
          if [ ! -f configure ]; then
            chmod +x autogen.sh 2>/dev/null || true
            ./autogen.sh || autoreconf -fi || true
          fi

          # Falls configure immer noch fehlt, Fehler ausgeben
          if [ ! -f configure ]; then
            echo "[ERROR] configure konnte nicht erzeugt werden!"
            exit 1
          fi

          ./configure \
            --prefix=/usr \
            --disable-video-x11 \
            --enable-video-fbcon \
            --enable-video-directfb \
            --disable-video-ps3 \
            --disable-video-svga \
            --disable-video-opengl \
            --disable-audio-oss \
            --disable-audio-dma \
            --enable-audio-alsa \
            --disable-joystick \
            --disable-cdrom \
            --disable-esd \
            --disable-nas \
            --disable-diskaudio \
            --disable-pulseaudio \
            --disable-arts \
            --enable-arm-simd \
            --enable-arm-neon \
            --enable-shared \
            --disable-static \
            CFLAGS="$OPTIMIZE" \
            LDFLAGS="$LDFLAGS"

          make -j"$(nproc)"

          cp "$(find /work/src/SDL-1.2 -name 'libSDL-1.2.so.0*' -print -quit)" /work/out/libs.aarch64/libSDL-1.2.so.0

          echo "==> Native SDL 1.2 Bibliothek gebaut (mit ARM SIMD/NEON):"
          ls -la /work/out/libs.aarch64/

          # =====================================================================
          # SCHRITT 3: Smokin' Guns Engine + Native Module bauen
          # =====================================================================
          cd /work/src
          if [ ! -d SmokinGuns ]; then git clone --depth=1 https://github.com/smokin-guns/SmokinGuns.git; fi
          cd SmokinGuns

          echo "==> Patch-Skript ausfuehren..."
          python3 /work/patch_arm64.py

          echo "==> Alte Artefakte bereinigen..."
          make clean || true

          echo "==> Smokin' Guns kompilieren (OHNE renderergl2, NUR native Module)..."
          make release -j1 PLATFORM=linux ARCH=aarch64 CC="$CC" \
            BUILD_STANDALONE=1 BUILD_GAME_QVM=0 BUILD_GAME_SO=1 BUILD_SERVER=0 \
            USE_OPENAL=0 USE_CODEC_VORBIS=0 USE_CURL=0 USE_MUMBLE=0 USE_VOIP=0 \
            USE_INTERNAL_ZLIB=1 USE_INTERNAL_SPEEX=1 USE_LOCAL_HEADERS=0 \
            WERROR=0 \
            CFLAGS="-w -fcommon -I/usr/include/SDL" \
            OPTIMIZE="$OPTIMIZE" LDFLAGS="$LDFLAGS"

          BUILD_OUT="$(find /work/src/SmokinGuns/build -maxdepth 1 -type d -name 'release-linux-aarch64' -print -quit)"
          echo "==> Build-Ausgabe: $BUILD_OUT"

          if [ -z "$BUILD_OUT" ] || [ ! -d "$BUILD_OUT" ]; then
            echo "[ERROR] Build-Ausgabeverzeichnis nicht gefunden!"
            find /work/src/SmokinGuns/build -maxdepth 2 -type d 2>/dev/null || true
            exit 1
          fi

          echo "==> Inhalt von BUILD_OUT:"
          ls -la "$BUILD_OUT"

          ENGINE_BIN="$(find "$BUILD_OUT" -maxdepth 1 -type f -executable ! -name '*.so' ! -name '*.sh' ! -name '*.a' -print -quit)"
          if [ -z "$ENGINE_BIN" ]; then
            echo "[ERROR] Keine Engine-Binary in $BUILD_OUT gefunden"
            exit 1
          fi
          echo "==> Engine-Binary erkannt: $ENGINE_BIN"
          cp "$ENGINE_BIN" /work/out/game/smokinguns.aarch64
          chmod +x /work/out/game/smokinguns.aarch64

          echo "==> Native .so-Module suchen..."
          find "$BUILD_OUT" -name '*.so' -type f -print
          find "$BUILD_OUT" -name '*.so' -type f -exec cp {} /work/out/game/ \;

          echo "==> Finale Spiel-Ausgabe:"
          ls -la /work/out/game/

          for mod in cgame qagame ui; do
            if ls /work/out/game/${mod}*.so 1>/dev/null 2>&1; then
              echo "  [OK] ${mod}.so gefunden"
            else
              echo "  [WARN] ${mod}.so NICHT gefunden!"
            fi
          done

          echo "==> Build abgeschlossen!"
          BUILD_SCRIPT_EOF
          chmod +x work/build.sh

      - name: Build inside Ubuntu 20.04 aarch64 container
        run: |
          docker run --rm --platform linux/arm64 -v "${{ github.workspace }}/work":/work -w /work ubuntu:20.04 bash /work/build.sh

      - name: Assemble PortMaster Package
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/package"
          rm -rf "$PKG"
          mkdir -p "$PKG/${PORT_DIR}/libs.aarch64"
          mkdir -p "$PKG/${PORT_DIR}/${PORT_DIR}"

          cp work/out/game/smokinguns.aarch64 "$PKG/${PORT_DIR}/smokinguns.aarch64"
          chmod +x "$PKG/${PORT_DIR}/smokinguns.aarch64"

          find work/out/game -maxdepth 1 -name '*.so' -exec cp {} "$PKG/${PORT_DIR}/${PORT_DIR}/" \; 2>/dev/null || true
          find work/out/game -maxdepth 1 -name '*.so' -exec cp {} "$PKG/${PORT_DIR}/" \; 2>/dev/null || true

          cp work/out/libs.aarch64/libGL.so.1 "$PKG/${PORT_DIR}/libs.aarch64/libGL.so.1"
          cp work/out/libs.aarch64/libEGL.so.1 "$PKG/${PORT_DIR}/libs.aarch64/libEGL.so.1"
          cp work/out/libs.aarch64/libSDL-1.2.so.0 "$PKG/${PORT_DIR}/libs.aarch64/libSDL-1.2.so.0"

          echo "=== Paketinhalt ==="
          find "$PKG" -type f | sort

          cat > "$PKG/${PORT_DIR}/port.json" <<'PORTJSON_EOF'
          {
            "version": 3,
            "name": "Smokin Guns.sh",
            "items": ["Smokin Guns.sh"],
            "items_opt": [],
            "attr": {
              "title": "Smokin' Guns",
              "porter": "community",
              "desc": "Native ARM64 build with GL4ES and NATIVE SDL 1.2 (ARM SIMD/NEON). No sdl12-compat, no QVM, no renderergl2. Cortex-A35 optimized.",
              "genres": ["fps", "shooter"],
              "porter_wallet": "",
              "image": {"screenshot": ""},
              "rtr": false
            }
          }
          PORTJSON_EOF

          cat > "$PKG/Smokin Guns.sh" <<'LAUNCH_EOF'
          #!/bin/bash
          GAMEDIR="/roms/ports/smokinguns"
          LOG_FILE="${GAMEDIR}/debug.log"
          exec > >(tee -a "$LOG_FILE") 2>&1

          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}
          if [ -d "/opt/system/Tools/PortMaster/" ]; then
              controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
              controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
              controlfolder="$XDG_DATA_HOME/PortMaster"
          else
              controlfolder="/roms/ports/PortMaster"
          fi

          if [ -f "${controlfolder}/control.txt" ]; then
              source "${controlfolder}/control.txt"
              [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"
              get_controls
          fi

          cd "$GAMEDIR" || exit 1
          export HOME="${GAMEDIR}"
          mkdir -p "${GAMEDIR}/.smokinguns"

          # Performance-Tuning: CPU-Governor auf performance
          echo "performance" | $ESUDO tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor 2>/dev/null || true

          # RAM-Tuning: Swappiness minimieren
          echo 10 > /proc/sys/vm/swappiness 2>/dev/null || true
          echo 1 > /proc/sys/vm/overcommit_memory 2>/dev/null || true

          # GL4ES Performance-Variablen (MAXIMUM)
          export LIBGL_ES=2
          export LIBGL_GL=1
          export LIBGL_NOTEST=1
          export LIBGL_FB=1
          export LIBGL_FBO=0
          export LIBGL_NOERROR=1
          export LIBGL_FORCE16BITS=1
          export LIBGL_BATCH=100
          export LIBGL_FASTMATH=1
          export LIBGL_NOBANNER=1
          export LIBGL_VSYNC=0
          export LIBGL_SILENTSTUB=1
          export LIBGL_XREFRESH=0
          export LIBGL_RECYCLEFBO=1
          export LIBGL_MIPMAP=5
          export LIBGL_SHRINK=8

          # SDL 1.2 native Treiber (fbcon, nicht kmsdrm!)
          export SDL_VIDEODRIVER=fbcon
          export SDL_AUDIODRIVER=alsa
          export SDL_FBDEV=/dev/fb0
          export LD_LIBRARY_PATH="${GAMEDIR}/libs.aarch64:${LD_LIBRARY_PATH}"

          $GPTOKEYB "smokinguns.aarch64" -c "${GAMEDIR}/smokinguns.gptk" &

          LD_PRELOAD="${GAMEDIR}/libs.aarch64/libGL.so.1:${GAMEDIR}/libs.aarch64/libEGL.so.1:${GAMEDIR}/libs.aarch64/libSDL-1.2.so.0" \
            "${GAMEDIR}/smokinguns.aarch64" \
            +set com_hunkMegs 256 \
            +set com_maxfps 40 \
            +set net_enabled 0 \
            +set sv_pure 0 \
            +set vm_cgame 0 \
            +set vm_game 0 \
            +set vm_ui 0 \
            +set s_useOpenAL 0 \
            +set r_customwidth 640 \
            +set r_customheight 480 \
            +set r_fullscreen 1 \
            +set fs_basepath "${GAMEDIR}" \
            +set fs_homepath "${GAMEDIR}" \
            +set fs_game smokinguns

          unset LD_PRELOAD
          unset LD_LIBRARY_PATH
          $ESUDO kill -9 $(pidof gptokeyb) 2>/dev/null || true
          $ESUDO setterm -cursor on > /dev/tty1 2>/dev/null || true
          printf "\033c" > /dev/tty1 2>/dev/null || true
          exit 0
          LAUNCH_EOF
          chmod +x "$PKG/Smokin Guns.sh"

      - name: Create zip artifact
        run: |
          cd package
          zip -r "$GITHUB_WORKSPACE/${ZIP_NAME}" "Smokin Guns.sh" "${PORT_DIR}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmokinGuns-PortMaster-RK3326-Native-SDL12-Max
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
