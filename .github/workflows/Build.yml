name: Build Smokin' Guns (RK3326 / ARM64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aarch64:
    # Nativer ARM64-Runner - kein QEMU, kein Docker
    runs-on: ubuntu-24.04-arm

    env:
      OPTIMIZE: "-O2 -pipe -mcpu=cortex-a35 -mtune=cortex-a35 -fomit-frame-pointer -fno-math-errno -fno-trapping-math -fno-stack-protector -fmerge-all-constants -DNDEBUG"
      LDFLAGS: "-Wl,-O1 -Wl,--as-needed"
      OUT_LIBS: "${{ github.workspace }}/out/libs.aarch64"
      SRC_DIR: "${{ github.workspace }}/build-work"
      PATCH_SCRIPT: "${{ github.workspace }}/.github/scripts/patch_arm64.py"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Abhaengigkeiten installieren
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential gcc g++ make cmake git ccache python3 pkg-config \
            autoconf automake libtool \
            libsdl1.2-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libpng-dev \
            zlib1g-dev \
            libogg-dev \
            libvorbis-dev \
            libopus-dev \
            libopusfile-dev \
            libcurl4-openssl-dev \
            libopenal-dev \
            libspeex-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libdrm-dev \
            libx11-dev \
            libxext-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libudev-dev \
            libasound2-dev \
            libpulse-dev
          mkdir -p "${OUT_LIBS}" "${SRC_DIR}"
          which sdl-config && sdl-config --version

      - name: gl4es bauen
        run: |
          cd "${SRC_DIR}"
          git clone --depth=1 https://github.com/ptitSeb/gl4es.git
          cd gl4es
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="${OPTIMIZE}" \
            -DNOX11=ON \
            -DGBM=ON \
            -DEGL_WRAPPER=ON \
            -DDEFAULT_ES=2 \
            -DSTATICLIB=OFF
          make -j$(nproc)
          # gl4es schreibt die .so-Dateien nach ../lib/, nicht nach build/lib/
          GL4ES_GL=$(find "${SRC_DIR}/gl4es" -name "libGL.so.1" -print -quit)
          GL4ES_EGL=$(find "${SRC_DIR}/gl4es" -name "libEGL.so.1" -print -quit)
          echo "Found libGL:  ${GL4ES_GL}"
          echo "Found libEGL: ${GL4ES_EGL}"
          cp "${GL4ES_GL}"  "${OUT_LIBS}/libGL.so.1"
          cp "${GL4ES_EGL}" "${OUT_LIBS}/libEGL.so.1"
          ls -la "${OUT_LIBS}"

      - name: SDL2 bauen
        run: |
          cd "${SRC_DIR}"
          git clone --depth=1 -b release-2.30.2 https://github.com/libsdl-org/SDL.git
          cd SDL
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/sdl2 \
            -DSDL_STATIC=OFF \
            -DSDL_SHARED=ON \
            -DSDL_KMSDRM=ON \
            -DSDL_WAYLAND=OFF
          make -j$(nproc) install
          SDL2_LIB=$(find /opt/sdl2 -name "libSDL2-2.0.so.0" -print -quit)
          echo "Found SDL2: ${SDL2_LIB}"
          cp "${SDL2_LIB}" "${OUT_LIBS}/libSDL2-2.0.so.0"
          ls -la "${OUT_LIBS}"

      - name: sdl12-compat patchen und bauen
        run: |
          cd "${SRC_DIR}"
          git clone --depth=1 https://github.com/libsdl-org/sdl12-compat.git
          cd sdl12-compat
          python3 "${PATCH_SCRIPT}"
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL2_INCLUDE_DIR=/opt/sdl2/include/SDL2 \
            -DSDL2_LIBRARY=/opt/sdl2/lib/libSDL2-2.0.so \
            -DCMAKE_C_FLAGS="${OPTIMIZE} -fvisibility=default"
          make -j$(nproc)
          SDL12_LIB=$(find "${SRC_DIR}/sdl12-compat" -name "libSDL-1.2.so.0" -print -quit)
          echo "Found sdl12-compat: ${SDL12_LIB}"
          cp "${SDL12_LIB}" "${OUT_LIBS}/libSDL-1.2.so.0"
          ls -la "${OUT_LIBS}"

      - name: Smokin' Guns patchen und bauen
        run: |
          cd "${SRC_DIR}"
          git clone --depth=1 https://github.com/smokin-guns/SmokinGuns.git
          cd SmokinGuns
          python3 "${PATCH_SCRIPT}"
          make release -j$(nproc) \
            PLATFORM=linux \
            ARCH=aarch64 \
            COMPILE_ARCH=aarch64 \
            CC="ccache gcc" \
            BUILD_STANDALONE=1 \
            Q3UIDIR=code/ui \
            BUILD_GAME_QVM=0 \
            BUILD_GAME_SO=1 \
            BUILD_SERVER=0 \
            BUILD_RENDERER_REND2=0 \
            USE_OPENAL=0 \
            USE_CODEC_VORBIS=0 \
            USE_CURL=0 \
            USE_MUMBLE=0 \
            USE_VOIP=0 \
            USE_INTERNAL_ZLIB=1 \
            USE_INTERNAL_SPEEX=1 \
            USE_LOCAL_HEADERS=0 \
            WERROR=0 \
            OPTIMIZE="${OPTIMIZE}" \
            LDFLAGS="${LDFLAGS}"
          ls -la build/release-linux-aarch64/

      - name: Bibliotheken neben die Binaerdateien kopieren
        run: |
          REL_DIR="${SRC_DIR}/SmokinGuns/build/release-linux-aarch64"
          cp "${OUT_LIBS}"/*.so* "${REL_DIR}/" || true
          echo "=== Final release directory ==="
          ls -la "${REL_DIR}/"
          echo "=== smokinguns subdir ==="
          ls -la "${REL_DIR}/smokinguns/" || true

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: smokinguns-rk3326-aarch64
          path: build-work/SmokinGuns/build/release-linux-aarch64/
          if-no-files-found: error
