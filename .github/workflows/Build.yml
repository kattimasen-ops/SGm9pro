name: Crack Smokin' Guns for RK3326 (PortMaster) - Ultra Optimized LTO Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-smokinguns.yml'

permissions:
  contents: read

env:
  ZIP_NAME: SmokinGuns-PortMaster-RK3326-Optimized.zip
  PORT_DIR: smokinguns

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zip utility
        run: sudo apt-get update -y && sudo apt-get install -y zip

      - name: Set up QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Write patch script into work directory
        run: |
          mkdir -p work
          cat <<'PY_EOF' > work/patch_arm64.py
          #!/usr/bin/env python3
          import os, sys, re

          def patch_makefile():
              makefile = "Makefile"
              if not os.path.exists(makefile):
                  print(f"[ERROR] {makefile} not found!")
                  sys.exit(1)
                  
              with open(makefile, "r", encoding="utf-8", errors="ignore") as f:
                  lines = f.readlines()

              new_lines = []
              builddir_matched = False

              for line in lines:
                  # 1. Strip out strict -Werror and diagnostic flags
                  line = re.sub(r'-Werror[a-zA-Z0-9=-]*', '', line)
                  line = re.sub(r'-Wmaybe-uninitialized', '', line)
                  
                  # 2. Make ALL rm commands safe globally by turning them into 'rm -f'
                  line = re.sub(r'\brm\s+', 'rm -f ', line)

                  # 3. Safely strip trailing slashes from BUILDDIR with diagnostics
                  if line.startswith("BUILDDIR") and "=" in line:
                      builddir_matched = True
                      parts = line.split('#', 1)
                      code_part = parts[0].rstrip()
                      if code_part.endswith('/'):
                          code_part = code_part.rstrip('/')
                      line = code_part + (' #' + parts[1] if len(parts) > 1 else '\n')

                  new_lines.append(line)

              if not builddir_matched:
                  print("[WARNING] BUILDDIR variable was not matched at line start! Inspect Makefile variable naming.")
              else:
                  print("[INFO] BUILDDIR successfully matched and normalized.")

              content = "".join(new_lines)

              # 4. Inject safe compiler overrides and disable rend2 renderer at the top
              patch = """
          override CFLAGS += -w -fcommon -I/usr/include/SDL -D__aarch64__=1 -DARCH_STRING=\\\"aarch64\\\"
          override BUILD_RENDERER_REND2=0
          """
              content = patch + content

              with open(makefile, "w", encoding="utf-8") as f:
                  f.write(content)
              print("[PATCHED] Makefile safely patched.")

          def patch_q_platform():
              patched = 0
              for root, dirs, files in os.walk("code"):
                  for file in files:
                      if file != "q_platform.h":
                          continue
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      
                      aarch64_override = (
                          "#if defined(__aarch64__) || defined(__arm64__) || defined(aarch64)\n"
                          "#ifndef ARCH_STRING\n"
                          "#define ARCH_STRING \"aarch64\"\n"
                          "#endif\n"
                          "#ifndef Q3_LITTLE_ENDIAN\n"
                          "#define Q3_LITTLE_ENDIAN\n"
                          "#endif\n"
                          "#endif\n\n"
                      )
                      if "ARCH_STRING" not in content:
                          content = aarch64_override + content

                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)
                      patched += 1
                      
              if patched == 0:
                  print("[WARNING] No q_platform.h files found!")
              else:
                  print(f"[INFO] Patched {patched} q_platform.h files successfully.")

          if __name__ == "__main__":
              if not os.path.exists("Makefile"):
                  print("[ERROR] Makefile not present in current working directory.")
                  sys.exit(1)
              patch_makefile()
              patch_q_platform()
              print("[DONE] All patches applied cleanly.")
          PY_EOF

      - name: Write in-container build script
        run: |
          mkdir -p work/src work/out/game work/out/libs.aarch64
          cat <<'BUILD_SCRIPT_EOF' > work/build.sh
          #!/bin/bash
          set -euo pipefail
          set -x
          export DEBIAN_FRONTEND=noninteractive
          
          # --- MAXIMUM PERFORMANCE FLAGS + LTO ---
          export OPTIMIZE="-O3 -march=armv8-a -mcpu=cortex-a35 -mtune=cortex-a35 -pipe -fomit-frame-pointer -ffast-math -ftree-vectorize -fno-semantic-interposition -DNDEBUG -w"
          export LDFLAGS="-Wl,-O1 -Wl,--as-needed"
          
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git pkg-config ca-certificates wget file zip python3 xxd ccache \
            libsdl1.2-dev libsdl2-dev \
            libfreetype6-dev libjpeg-dev libpng-dev zlib1g-dev \
            libogg-dev libvorbis-dev libopus-dev libopusfile-dev \
            libcurl4-openssl-dev libopenal-dev libspeex-dev \
            libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev \
            libx11-dev libxext-dev libgl1-mesa-dev libglu1-mesa-dev
          git config --global --add safe.directory '*'

          # Configure ccache for blazing-fast rebuilds
          ccache -M 2G
          export CC="ccache gcc"
          export CXX="ccache g++"

          # CMake for GL4ES
          CMAKE_VERSION=3.28.3
          wget -q "https://cmake.org/files/v3.28/cmake-${CMAKE_VERSION}-linux-aarch64.tar.gz" -O /tmp/cmake.tar.gz
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          export PATH="/opt/cmake/bin:$PATH"

          # --- Build GL4ES ---
          cd /work/src
          if [ ! -d gl4es ]; then git clone --depth=1 https://github.com/ptitSeb/gl4es.git; fi
          cd gl4es
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$OPTIMIZE" \
            -DNOX11=ON -DGLX_STUBS=ON -DEGL_WRAPPER=ON -DGBM=ON \
            -DSTATICLIB=OFF -DDEFAULT_ES=2 -DNOERROR=ON
          make -j"$(nproc)"
          
          GL4ES_LIB="$(find /work/src/gl4es -name 'libGL.so.1' -print -quit)"
          EGL_LIB="$(find /work/src/gl4es -name 'libEGL.so.1' -print -quit)"
          cp "$GL4ES_LIB" /work/out/libs.aarch64/libGL.so.1
          cp "$EGL_LIB" /work/out/libs.aarch64/libEGL.so.1

          # --- Build libsdl1.2-compat from source (Tests Disabled) ---
          cd /work/src
          if [ ! -d sdl12-compat ]; then
            git clone --depth=1 https://github.com/libsdl-org/sdl12-compat.git
          fi
          cd sdl12-compat
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DSDL2_INCLUDE_DIR=/usr/include/SDL2 \
            -DSDL2_LIBRARY=/usr/lib/aarch64-linux-gnu/libSDL2.so \
            -DCMAKE_C_FLAGS="$OPTIMIZE" \
            -DSDL12TESTS=OFF
          make -j"$(nproc)"
          
          SDL12_COMPAT_LIB="$(find /work/src/sdl12-compat -name 'libSDL-1.2.so.0' -print -quit)"
          cp "$SDL12_COMPAT_LIB" /work/out/libs.aarch64/libSDL-1.2.so.0

          # --- Build Smokin' Guns ---
          cd /work/src
          if [ ! -d SmokinGuns ]; then git clone --depth=1 https://github.com/smokin-guns/SmokinGuns.git; fi
          cd SmokinGuns

          echo "==> Running patch script..."
          python3 /work/patch_arm64.py

          echo "==> Cleaning stale artifacts..."
          make clean || true

          echo "==> Compiling Smokin' Guns binary and native shared libraries..."
          make -j"$(nproc)" V=1 PLATFORM=linux ARCH=aarch64 CC="$CC" \
            BUILD_STANDALONE=1 BUILD_GAME_QVM=1 BUILD_GAME_SO=1 BUILD_SERVER=0 \
            USE_OPENAL=0 USE_CODEC_VORBIS=0 USE_CURL=0 USE_MUMBLE=0 USE_VOIP=0 \
            USE_INTERNAL_ZLIB=1 USE_INTERNAL_SPEEX=1 USE_LOCAL_HEADERS=0 \
            BUILD_RENDERER_REND2=0 WERROR=0 CFLAGS="-w" \
            OPTIMIZE="$OPTIMIZE" LDFLAGS="$LDFLAGS"

          BUILD_OUT="$(find /work/src/SmokinGuns/build -maxdepth 1 -type d -name 'release-linux-aarch64' -print -quit)"
          CLIENT_BIN="$(find "$BUILD_OUT" -maxdepth 1 -type f -executable ! -name '*.so' -print -quit)"
          cp "$CLIENT_BIN" /work/out/game/smokinguns.aarch64
          chmod +x /work/out/game/smokinguns.aarch64
          find "$BUILD_OUT" -name '*.so' -exec cp {} /work/out/game/ \; || true

          # Pack QVM game logic into z_vm.pk3
          echo "==> Packing QVM files..."
          QVM_FILES="$(find "$BUILD_OUT" -name '*.qvm' -type f)"
          if [ -n "$QVM_FILES" ]; then
            rm -rf /tmp/vm_pack
            mkdir -p /tmp/vm_pack/vm
            for f in $QVM_FILES; do
              cp "$f" "/tmp/vm_pack/vm/$(basename "$f")"
            done
            ( cd /tmp/vm_pack && zip -r /work/out/game/z_vm.pk3 . )
          else
            echo "ERROR: No QVM files found!" >&2
            exit 1
          fi
          BUILD_SCRIPT_EOF
          chmod +x work/build.sh

      - name: Build inside Ubuntu 20.04 aarch64 container
        run: |
          docker run --rm --platform linux/arm64 -v "${{ github.workspace }}/work":/work -w /work ubuntu:20.04 bash /work/build.sh

      - name: Assemble PortMaster Package
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/package"
          rm -rf "$PKG"
          mkdir -p "$PKG/${PORT_DIR}/libs.aarch64"
          mkdir -p "$PKG/${PORT_DIR}/${PORT_DIR}"

          cp work/out/game/smokinguns.aarch64 "$PKG/${PORT_DIR}/smokinguns.aarch64"
          chmod +x "$PKG/${PORT_DIR}/smokinguns.aarch64"
          find work/out/game -name '*.so' -exec cp {} "$PKG/${PORT_DIR}/" \; || true
          find work/out/game -name '*.so' -exec cp {} "$PKG/${PORT_DIR}/${PORT_DIR}/" \; || true

          cp work/out/game/z_vm.pk3 "$PKG/${PORT_DIR}/${PORT_DIR}/z_vm.pk3"
          cp work/out/libs.aarch64/libGL.so.1 "$PKG/${PORT_DIR}/libs.aarch64/libGL.so.1"
          cp work/out/libs.aarch64/libEGL.so.1 "$PKG/${PORT_DIR}/libs.aarch64/libEGL.so.1"
          cp work/out/libs.aarch64/libSDL-1.2.so.0 "$PKG/${PORT_DIR}/libs.aarch64/libSDL-1.2.so.0"

          cat > "$PKG/${PORT_DIR}/smokinguns.gptk" <<'GPTK_EOF'
          [ANALOG1]
          UP = W
          DOWN = S
          LEFT = A
          RIGHT = D

          [ANALOG2]
          UP = mouse_move_up
          DOWN = mouse_move_down
          LEFT = mouse_move_left
          RIGHT = mouse_move_right

          [BUTTONS]
          A = mouse_left
          B = mouse_right
          X = SPACE
          Y = R
          L1 = TAB
          R1 = mouse_middle
          L2 = Q
          R2 = E
          START = ESCAPE
          SELECT = F1
          L3 = LEFTSHIFT
          R3 = C
          UP = UP
          DOWN = DOWN
          LEFT = LEFT
          RIGHT = RIGHT
          GPTK_EOF

          cat > "$PKG/${PORT_DIR}/port.json" <<'PORTJSON_EOF'
          {
            "version": 2,
            "name": "Smokin Guns.sh",
            "items": ["Smokin Guns.sh"],
            "items_opt": [],
            "attr": {
              "title": "Smokin' Guns",
              "porter": "community",
              "desc": "Ultra-optimized LTO Smokin' Guns port with GL4ES batching for RK3326.",
              "genres": ["fps", "shooter"],
              "porter_wallet": "",
              "image": {"screenshot": ""},
              "rtr": false
            }
          }
          PORTJSON_EOF

          cat > "$PKG/Smokin Guns.sh" <<'LAUNCH_EOF'
          #!/bin/bash
          # PortMaster launch script for Smokin' Guns (RK3326 / M9 Pro / R36S)
          # Non-Blocking Exit Fix, Max Performance GL4ES Batching & Native 640x480 KMSDRM Rendering

          GAMEDIR="/roms/ports/smokinguns"
          LOG_FILE="${GAMEDIR}/debug.log"
          exec > >(tee -a "$LOG_FILE") 2>&1

          # --- PortMaster Control Setup ---
          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}
          if [ -d "/opt/system/Tools/PortMaster/" ]; then
              controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
              controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
              controlfolder="$XDG_DATA_HOME/PortMaster"
          else
              controlfolder="/roms/ports/PortMaster"
          fi

          if [ -f "${controlfolder}/control.txt" ]; then
              source "${controlfolder}/control.txt"
              [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"
              get_controls
          else
              echo "ERROR: ${controlfolder}/control.txt not found." >&2
          fi

          cd "$GAMEDIR" || exit 1
          export HOME="${GAMEDIR}"
          mkdir -p "${GAMEDIR}/.smokinguns"

          # --- 1. Deactivate Non-Essential Background Processes ---
          $ESUDO systemctl stop smbd 2>/dev/null || true
          $ESUDO systemctl stop nmbd 2>/dev/null || true
          $ESUDO systemctl stop dropbear 2>/dev/null || true
          $ESUDO systemctl stop ssh 2>/dev/null || true
          $ESUDO systemctl stop bluetooth 2>/dev/null || true
          killall -9 mpg123 2>/dev/null || true
          killall -9 ffplay 2>/dev/null || true

          # --- 2. CPU Governor & Memory Tuning ---
          renice -n -15 $$ 2>/dev/null || true
          echo "performance" | $ESUDO tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor 2>/dev/null || true
          $ESUDO sysctl -w vm.swappiness=10 2>/dev/null || true
          $ESUDO sysctl -w vm.vfs_cache_pressure=50 2>/dev/null || true
          $ESUDO sysctl -w vm.overcommit_memory=1 2>/dev/null || true

          $ESUDO sync
          echo 3 | $ESUDO tee /proc/sys/vm/drop_caches 2>/dev/null || true

          # --- 3. Stable GL4ES & KMSDRM Environment ---
          export LIBGL_ES=2
          export LIBGL_GL=1
          export LIBGL_NOTEST=1
          export LIBGL_FB=1
          export LIBGL_FBO=0
          export LIBGL_NOERROR=1
          export LIBGL_FORCE16BITS=1
          export LIBGL_MIPMAP=3
          export LIBGL_NOINTOVLHACK=1

          # --- GL4ES Draw Call & Shader Optimizations ---
          export LIBGL_BATCH=100
          export LIBGL_MAX_SPIN=100
          export LIBGL_FASTMATH=1
          export LIBGL_DEFAULT_LOG=0

          export SDL_VIDEODRIVER=kmsdrm
          export SDL_AUDIODRIVER=alsa
          export LD_LIBRARY_PATH="${GAMEDIR}/libs.aarch64:${LD_LIBRARY_PATH}"

          EXTRA_SETTINGS="+set sv_pure 0 +set vm_cgame 0 +set vm_game 0 +set vm_ui 0"

          # --- 4. Launch Engine ---
          $GPTOKEYB "smokinguns.aarch64" -c "${GAMEDIR}/smokinguns.gptk" &

          LD_PRELOAD="${GAMEDIR}/libs.aarch64/libGL.so.1:${GAMEDIR}/libs.aarch64/libEGL.so.1:${GAMEDIR}/libs.aarch64/libSDL-1.2.so.0" \
            "${GAMEDIR}/smokinguns.aarch64" \
            +set com_hunkMegs 256 \
            +set com_maxfps 60 \
            +set cl_maxpackets 60 \
            +set rate 25000 \
            +set snaps 20 \
            +set net_enabled 0 \
            +set vm_cgame 0 \
            +set vm_game 0 \
            +set vm_ui 0 \
            +set s_useOpenAL 0 \
            +set s_khz 22 \
            +set s_mixahead 0.08 \
            +set s_mixPreStep 0.05 \
            +set in_joystick 0 \
            +set in_mouse 1 \
            +set r_mode -1 \
            +set r_customwidth 640 \
            +set r_customheight 480 \
            +set r_fullscreen 1 \
            +set r_noborder 1 \
            +set r_finish 0 \
            +set r_swapInterval 0 \
            +set r_vertexLight 1 \
            +set r_overBrightBits 0 \
            +set r_ignorehwgamma 1 \
            +set r_ext_compressed_textures 1 \
            +set r_ext_framebuffer 0 \
            +set r_picmip 2 \
            +set r_lodbias 0 \
            +set r_subdivisions 12 \
            +set r_detailtextures 0 \
            +set r_texturebits 16 \
            +set r_colorbits 16 \
            +set r_dynamiclight 0 \
            +set r_shadows 0 \
            +set r_fastsky 1 \
            +set r_stencilbits 0 \
            +set r_lodCurveError 250 \
            +set cg_shadows 0 \
            +set cg_gibs 0 \
            +set cg_marks 0 \
            +set cg_impactparticles 0 \
            +set cg_brassTime 0 \
            +set cg_simpleItems 0 \
            +set cg_draw3dIcons 0 \
            +set cg_farclip 0 \
            +set sensitivity 18 \
            +set cl_yawspeed 140 \
            +set cl_pitchspeed 140 \
            +set fs_basepath "${GAMEDIR}" \
            +set fs_homepath "${GAMEDIR}" \
            +set fs_game smokinguns \
            $EXTRA_SETTINGS

          # --- 5. Clean Non-Blocking Exit & TTY Recovery ---
          unset LD_PRELOAD
          unset LD_LIBRARY_PATH

          $ESUDO kill -9 $(pidof gptokeyb) 2>/dev/null || true

          # Restore background services asynchronously so the script exits instantly
          (
            $ESUDO systemctl start smbd 2>/dev/null || true
            $ESUDO systemctl start nmbd 2>/dev/null || true
            $ESUDO systemctl start dropbear 2>/dev/null || true
            $ESUDO systemctl start ssh 2>/dev/null || true
            $ESUDO systemctl start bluetooth 2>/dev/null || true
          ) &

          # Force virtual terminal reset to restore EmulationStation screen buffer
          $ESUDO setterm -cursor on > /dev/tty1 2>/dev/null || true
          printf "\033c" > /dev/tty1 2>/dev/null || true

          echo "Game exited cleanly. Returning to menu."
          exit 0
          LAUNCH_EOF
          chmod +x "$PKG/Smokin Guns.sh"

      - name: Create zip artifact
        run: |
          cd package
          zip -r "$GITHUB_WORKSPACE/${ZIP_NAME}" "Smokin Guns.sh" "${PORT_DIR}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmokinGuns-PortMaster-RK3326-Optimized
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
