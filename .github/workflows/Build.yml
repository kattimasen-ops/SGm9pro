name: Create Smokin Guns ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Clone Official Smokin' Guns Source Code
        run: |
          git clone --depth=1 https://github.com/smokin-guns/SmokinGuns.git temp_source
          cp -r temp_source/* .
          cp -r temp_source/.github . 2>/dev/null || true
          rm -rf temp_source

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Cache ccache directory
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-aarch64-${{ github.sha }}
          restore-keys: |
            ccache-aarch64-

      - name: Build inside ARM64 Docker Container
        timeout-minutes: 120
        run: |
          mkdir -p .ccache
          docker run --rm --privileged --platform linux/arm64 \
            -v ${{ github.workspace }}:/work \
            -v ${{ github.workspace }}/.ccache:/root/.ccache \
            -e CC="ccache gcc" \
            -e TERM="dumb" \
            -e PYTHONUNBUFFERED=1 \
            arm64v8/ubuntu:20.04 bash -c "
            set -e
            set -o pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y \
              build-essential python3 python3-pip git \
              libsdl2-dev libopenal-dev libcurl4-openssl-dev \
              python3-urllib3 ccache pkg-config cmake libfreetype-dev

            ccache -M 2G
            git config --global --add safe.directory /work
            cd /work
            echo '===== RUNNING PATCH SCRIPT ====='
            python3 -u .github/scripts/patch_arm64.py

            echo '===== RUNNING MAKE ====='
            make -j$(nproc) ARCH=aarch64 BUILD_CLIENT=1 BUILD_GAME_SO=1 USE_SDL2=1 2>&1 | tee /work/build-full.log
          "

      - name: Upload Full Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: build-full.log
          retention-days: 30

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smokinguns-arm64
          path: build/release-linux-aarch64/
          retention-days: 30
