name: Create Smokin Guns ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Build inside ARM64 Docker Container
        run: |
          docker run --rm --privileged -v ${{ github.workspace }}:/work arm64v8/ubuntu:20.04 bash -c "
            apt-get update && apt-get install -y build-essential python3 git libsdl2-dev libopenal-dev libcurl4-openssl-dev
            cd /work
            python3 .github/scripts/patch_arm64.py
            make -j$(nproc) ARCH=aarch64 BUILD_GAME_SO=1 OPTIMIZE=\"-O3 -mcpu=cortex-a35 -mtune=cortex-a35 -pipe -fomit-frame-pointer -ffast-math -ftree-vectorize -fno-math-errno -fno-trapping-math -fno-semantic-interposition -fno-plt -fno-exceptions -fno-rtti -fno-stack-protector -fno-asynchronous-unwind-tables -fmerge-all-constants -falign-functions=16 -falign-loops=16 -DNDEBUG -w -fcommon -fopenmp-simd -flax-vector-conversions -mearly-ra=all\" LDFLAGS=\"-Wl,-O1 -Wl,--as-needed -Wl,--strip-all\"
          "

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: smokinguns-arm64
          path: build/release-linux-aarch64/
