name: Build Smokin' Guns (RK3326 / ARM64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-22.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cross-Compile im Ubuntu 20.04 Container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            ubuntu:20.04 \
            bash /work/.github/scripts/build.sh

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: smokinguns-rk3326-aarch64
          path: build-work/SmokinGuns/build/release-linux-aarch64/
          if-no-files-found: error
