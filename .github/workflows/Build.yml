name: Build Smokin' Guns (aarch64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: QEMU für ARM64 Emulation einrichten
        uses: docker/setup-qemu-action@v3

      - name: Build im ARM64 Docker-Container ausführen
        uses: addnab/docker-run-action@v3
        with:
          image: arm64v8/ubuntu:22.04
          options: -v ${{ github.workspace }}:/work -w /work
          run: |
            set -e
            
            # Systemaktualisierung & Installation von SDL 1.2 + Abhängigkeiten
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential \
              gcc \
              g++ \
              make \
              ccache \
              python3 \
              libsdl1.2-dev \
              libopenal-dev \
              libcurl4-openssl-dev \
              libvorbis-dev \
              libogg-dev \
              libfreetype6-dev \
              libpng-dev \
              zlib1g-dev

            # Python Patch-Skript zur Säuberung des Makefiles ausführen
            python3 patch_build.py

            # Build für aarch64 mit expliziten SDL 1.2 Flags starten
            make USE_SDL2=0 ARCH=aarch64 PLATFORM=linux -j$(nproc) release

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: smokinguns-aarch64
          path: build/release-linux-aarch64/
