name: Baue Smokin' Guns (RK3326 / ARM64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-aarch64:
    runs-on: ubuntu-latest

    env:
      OPTIMIZE: "-O2 -pipe -mcpu=cortex-a35 -mtune=cortex-a35 -fomit-frame-pointer -fno-math-errno -fno-trapping-math -fno-stack-protector -fmerge-all-constants -DNDEBUG"
      LDFLAGS: "-Wl,-O1 -Wl,--as-needed"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build in Ubuntu 20.04 ARM64-Umgebung ausfuehren
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: aarch64
          distro: ubuntu20.04
          githubToken: ${{ github.token }}

          # [FIX] apt-get MUSS im install-Block stehen (laeuft als root
          # waehrend docker build). NICHT im setup-Block (laeuft auf dem
          # Host als Runner-User ohne Schreibrechte auf /var/lib/apt/lists).
          install: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential \
              gcc \
              g++ \
              make \
              ccache \
              python3 \
              libsdl1.2-dev \
              libopenal-dev \
              libcurl4-openssl-dev \
              libvorbis-dev \
              libogg-dev \
              libfreetype6-dev \
              libpng-dev \
              zlib1g-dev
            which sdl-config && sdl-config --version

          # [FIX] KEIN dockerRunArgs. In v3 ersetzt dockerRunArgs die
          # Standardargumente (--platform, --workdir /work, --volume
          # $PWD:/work) statt sie zu ergaenzen. Das war die Ursache fuer
          # "no specific platform was requested" und "can't open file
          # 'patch_arm64.py'". Ohne dockerRunArgs setzt die Action die
          # Standardargumente korrekt und der Container laeuft in /work.
          run: |
            pwd
            ls -la
            python3 patch_arm64.py
            make USE_SDL2=0 ARCH=aarch64 PLATFORM=linux -j$(nproc) release \
              OPTIMIZE="$OPTIMIZE" \
              LDFLAGS="$LDFLAGS"

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: smokinguns-rk3326-aarch64
          path: build/release-linux-aarch64/
