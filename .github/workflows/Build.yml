name: still mir Smokin' Guns for RK3326 (PortMaster)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-smokinguns.yml'

permissions:
  contents: read

env:
  ZIP_NAME: SmokinGuns-PortMaster-RK3326.zip
  PORT_DIR: smokinguns

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zip utility
        run: sudo apt-get update -y && sudo apt-get install -y zip

      - name: Set up QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Write in-container build script
        run: |
          mkdir -p work/src work/out/game work/out/libs.aarch64
          cat <<'BUILD_SCRIPT_EOF' > work/build.sh
          #!/bin/bash
          set -euo pipefail
          set -x
          export DEBIAN_FRONTEND=noninteractive
          export OPTIMIZE="-O2 -march=armv8-a -mcpu=cortex-a35 -mtune=cortex-a35 -pipe -fomit-frame-pointer -ffast-math"
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git pkg-config ca-certificates wget file zip python3 xxd \
            libsdl1.2-dev libsdl2-dev \
            libfreetype6-dev libjpeg-dev libpng-dev zlib1g-dev \
            libogg-dev libvorbis-dev libopus-dev libopusfile-dev \
            libcurl4-openssl-dev libopenal-dev libspeex-dev \
            libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev \
            libx11-dev libxext-dev libgl1-mesa-dev
          git config --global --add safe.directory '*'

          CMAKE_VERSION=3.28.3
          wget -q "https://cmake.org/files/v3.28/cmake-${CMAKE_VERSION}-linux-aarch64.tar.gz" -O /tmp/cmake.tar.gz
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          export PATH="/opt/cmake/bin:$PATH"
          cmake --version

          cd /work/src
          if [ ! -d gl4es ]; then git clone --depth=1 https://github.com/ptitSeb/gl4es.git; fi
          cd gl4es
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$OPTIMIZE" \
            -DNOX11=ON -DGLX_STUBS=ON -DEGL_WRAPPER=ON -DGBM=ON \
            -DSTATICLIB=OFF -DDEFAULT_ES=2
          make -j"$(nproc)"
          cd /work/src
          GL4ES_LIB="$(find /work/src/gl4es -name 'libGL.so.1' -print -quit)"
          if [ -z "$GL4ES_LIB" ]; then echo "ERROR: libGL.so.1 was not produced by the gl4es build" >&2; exit 1; fi
          cp "$GL4ES_LIB" /work/out/libs.aarch64/libGL.so.1

          cd /work/src
          if [ ! -d SmokinGuns ]; then git clone --depth=1 https://github.com/smokin-guns/SmokinGuns.git; fi
          cd SmokinGuns

          echo "==> Applying comprehensive ARM64 patches..."
          python3 -c '
          import os

          # 1. Force CFLAGS and renderer settings into Makefile
          if os.path.exists("Makefile"):
              with open("Makefile", "r") as f:
                  mcontent = f.read()
              patch_flags = "\noverride CFLAGS += -I/usr/include/SDL -DARCH_STRING=\\\"aarch64\\\" -DQ3_LITTLE_ENDIAN -D__aarch64__=1\n"
              patch_flags += "\noverride BUILD_RENDERER_OPENGL1=1\noverride BUILD_RENDERER_OPENGL2=0\n"
              # Also force defines for q3lcc (QVM compiler) – this is crucial
              patch_flags += "\nQ3LCC_CFLAGS += -DARCH_STRING=\\\"aarch64\\\" -DQ3_LITTLE_ENDIAN -D__aarch64__=1\n"
              with open("Makefile", "w") as f:
                  f.write(patch_flags + mcontent)
              print("[PATCHED] Added global override CFLAGS, renderer and Q3LCC flags to Makefile")

          # 2. Patch q_platform.h: force __aarch64__ and provide fallback definitions
          for root, dirs, files in os.walk("code"):
              for file in files:
                  if file == "q_platform.h":
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      # Force __aarch64__ at the top of the file (after include guard)
                      # We assume the include guard is the first non-comment line; we insert after it.
                      # Simple approach: prepend a define if not already present.
                      if "#ifndef __aarch64__" not in content:
                          # Insert after the first #ifndef ... #define ... #endif block (the include guard)
                          lines = content.split("\n")
                          for i, line in enumerate(lines):
                              if line.startswith("#define") and "guard" in line:
                                  # We can't reliably know guard name; instead, add at very beginning after any leading comments
                                  pass
                          # Simpler: add at the very top after initial comments (but before any code)
                          # We'll just prepend to the file, but ensure it doesn't break include guards.
                          # Since q_platform.h has an include guard, we can add the define inside the guard.
                          # Find first occurrence of "#ifndef" and insert after it.
                          # This is fragile. Better: we can add a fallback at the end of the architecture check.
                          # Let's instead modify the #elif block to be independent of __aarch64__.
                          # Actually, we can define __aarch64__ as a macro if not defined, right after the include guard line.
                          # We'll find the line containing "#define Q3_PLATFORM_H" or similar? Could be generic.
                          # To avoid complexity, we'll add a fallback at the very beginning of the file:
                          # #ifndef __aarch64__\n#define __aarch64__ 1\n#endif
                          # This will be before the include guard? That might cause issues if the include guard is not yet defined.
                          # Better to add it inside the include guard. So we need to find the end of the include guard opening.
                          # The structure usually is:
                          # #ifndef SOMETHING
                          # #define SOMETHING
                          # ... content ...
                          # #endif
                          # We can insert after the #define SOMETHING line.
                          # Since we don't know the macro name, we can just add the define right after the first "#define " line that follows the first "#ifndef".
                          # Let's implement a simple logic:
                          if "#ifndef __aarch64__" not in content:
                              # insert after the first line that starts with "#define" and appears after the first "#ifndef"
                              lines = content.split("\n")
                              new_lines = []
                              inserted = False
                              for line in lines:
                                  new_lines.append(line)
                                  if not inserted and line.startswith("#define") and len(lines.index(line)) > 0:
                                      # Check if we are inside the include guard (after the first #ifndef)
                                      # Actually, we can just insert after every "#define" line that is part of the guard? Risky.
                                      pass
                              # Simpler: insert at a known location: after the line "/*" we can't.
                              # For robustness, we'll just replace the "#error \"Architecture not supported\"" block with a fallback that always works.
                              # We'll keep our previous block but also add a forced define of __aarch64__ before the architecture check.
                              # So we'll insert "#define __aarch64__ 1" at the top of the file (before include guard) – but that is okay because the guard only protects the content after it.
                              # Actually, putting #define outside the guard is fine; it may get defined multiple times but that's okay.
                              content = "#ifndef __aarch64__\n#define __aarch64__ 1\n#endif\n" + content
                              # Now, ensure the #elif block for aarch64 matches (it will, because __aarch64__ is defined)
                              # Also, the existing #error will not be reached.
                              with open(filepath, "w", encoding="utf-8") as f:
                                  f.write(content)
                              print(f"[PATCHED] Forced __aarch64__ in {filepath}")

          # 3. Remove any ARCH_STRING injections we previously added to .c/.h files (since q_platform.h now defines it)
          # This step is not needed if we didn't add them, but we might have from earlier runs.
          # We'll skip removal; it's harmless warnings only.

          '

          # Now run make with correct variables
          make -j"$(nproc)" V=1 PLATFORM=linux ARCH=aarch64 CC=gcc \
            BUILD_STANDALONE=1 BUILD_GAME_QVM=1 BUILD_GAME_SO=0 BUILD_SERVER=0 \
            USE_OPENAL=0 USE_CODEC_VORBIS=0 USE_CURL=0 USE_MUMBLE=0 USE_VOIP=0 \
            USE_INTERNAL_ZLIB=1 USE_INTERNAL_SPEEX=1 USE_LOCAL_HEADERS=0 \
            BUILD_RENDERER_OPENGL1=1 BUILD_RENDERER_OPENGL2=0 \
            OPTIMIZE="$OPTIMIZE"

          BUILD_OUT="$(find /work/src/SmokinGuns/build -maxdepth 1 -type d -name 'release-linux-aarch64' -print -quit)"
          if [ -z "$BUILD_OUT" ]; then echo "ERROR: could not locate SmokinGuns build output directory" >&2; find /work/src/SmokinGuns/build -maxdepth 1 -type d >&2 || true; exit 1; fi

          CLIENT_BIN="$(find "$BUILD_OUT" -maxdepth 1 -type f -executable ! -name '*.so' -print -quit)"
          if [ -z "$CLIENT_BIN" ]; then echo "ERROR: could not locate the compiled client binary in $BUILD_OUT" >&2; ls -la "$BUILD_OUT" >&2 || true; exit 1; fi
          cp "$CLIENT_BIN" /work/out/game/smokinguns.aarch64
          chmod +x /work/out/game/smokinguns.aarch64

          find "$BUILD_OUT" -maxdepth 1 -name '*.so' -exec cp {} /work/out/game/ \; || true

          VM_DIR="$(find /work/src/SmokinGuns/build -type d -name vm -print -quit)"
          if [ -n "$VM_DIR" ]; then
            ( cd "$(dirname "$VM_DIR")" && zip -r /work/out/game/z_vm.pk3 vm )
            echo "Packed QVM game logic into z_vm.pk3 (from $VM_DIR)"
          else
            echo "ERROR: no vm/ directory found - z_vm.pk3 was NOT created!" >&2
            exit 1
          fi

          file /work/out/game/smokinguns.aarch64
          file /work/out/libs.aarch64/libGL.so.1
          echo "Build finished successfully."
          BUILD_SCRIPT_EOF
          chmod +x work/build.sh

      - name: Build inside Ubuntu 20.04 aarch64 container (glibc 2.31)
        run: |
          docker run --rm --platform linux/arm64 -v "${{ github.workspace }}/work":/work -w /work ubuntu:20.04 bash /work/build.sh

      - name: Assemble PortMaster package
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/package"
          rm -rf "$PKG"
          mkdir -p "$PKG/${PORT_DIR}/libs.aarch64"
          mkdir -p "$PKG/${PORT_DIR}/${PORT_DIR}"

          cp work/out/game/smokinguns.aarch64 "$PKG/${PORT_DIR}/smokinguns.aarch64"
          chmod +x "$PKG/${PORT_DIR}/smokinguns.aarch64"
          find work/out/game -maxdepth 1 -name '*.so' -exec cp {} "$PKG/${PORT_DIR}/" \; || true

          if [ -f work/out/game/z_vm.pk3 ]; then
            cp work/out/game/z_vm.pk3 "$PKG/${PORT_DIR}/${PORT_DIR}/z_vm.pk3"
          else
            echo "ERROR: z_vm.pk3 missing!" >&2
            exit 1
          fi

          cp work/out/libs.aarch64/libGL.so.1 "$PKG/${PORT_DIR}/libs.aarch64/libGL.so.1"

          cat > "$PKG/${PORT_DIR}/${PORT_DIR}/PUT_YOUR_PK3_FILES_HERE.txt" <<'PLACEHOLDER_EOF'
          Copy your own legally obtained Smokin' Guns .pk3 data files
          (e.g. sg_pak0.pk3) into this folder before launching the port.
          PLACEHOLDER_EOF

          cat > "$PKG/${PORT_DIR}/smokinguns.gptk" <<'GPTK_EOF'
          [ANALOG1]
          UP = W
          DOWN = S
          LEFT = A
          RIGHT = D

          [ANALOG2]
          UP = mouse_move_up
          DOWN = mouse_move_down
          LEFT = mouse_move_left
          RIGHT = mouse_move_right

          [BUTTONS]
          A = mouse_left
          B = mouse_right
          X = SPACE
          Y = R
          L1 = TAB
          R1 = mouse_middle
          L2 = Q
          R2 = E
          START = ESCAPE
          SELECT = F1
          L3 = LEFTSHIFT
          R3 = C
          UP = UP
          DOWN = DOWN
          LEFT = LEFT
          RIGHT = RIGHT
          GPTK_EOF

          cat > "$PKG/${PORT_DIR}/port.json" <<'PORTJSON_EOF'
          {
            "version": 2,
            "name": "Smokin Guns.sh",
            "items": [
              "Smokin Guns.sh"
            ],
            "items_opt": [],
            "attr": {
              "title": "Smokin' Guns",
              "porter": "community",
              "desc": "Standalone western-themed FPS built on the ioquake3 engine, using GL4ES to run on OpenGL ES 2.0 hardware.",
              "genres": [
                "fps",
                "shooter"
              ],
              "porter_wallet": "",
              "image": {
                "screenshot": ""
              },
              "rtr": false
            }
          }
          PORTJSON_EOF

          cat > "$PKG/${PORT_DIR}/README.md" <<'README_EOF'
          # Smokin' Guns - PortMaster (RK3326 / M9 Pro)

          This port ships the compiled aarch64 engine binary, the QVM game
          logic (z_vm.pk3), and the GL4ES translation layer. Copyrighted game
          data is NOT included and must be supplied by you.

          ## Required files

          Copy your own legally obtained sg_pak0.pk3 (and any optional fan
          packs, such as included_fanpak0.pk3) into:

              smokinguns/smokinguns/

          Final on-device layout:

              smokinguns/
              |-- smokinguns.aarch64
              |-- smokinguns.gptk
              |-- port.json
              |-- libs.aarch64/
              |   `-- libGL.so.1
              `-- smokinguns/
                  |-- z_vm.pk3
                  `-- sg_pak0.pk3

          ## Technical notes

          - Rendering goes through GL4ES (GBM/EGL backend, no X11) to
            translate the engine's desktop OpenGL calls into the Mali-G31's
            native OpenGL ES 2.0.
          - com_hunkMegs is capped at 256 in the launch script to keep the
            Linux OOM killer from terminating the game on this 1GB-RAM
            device.
          - Controls are mapped with gptokeyb using smokinguns.gptk; the
            left stick moves (WASD), the right stick drives the mouse look.
          README_EOF

          cat > "$PKG/Smokin Guns.sh" <<'LAUNCH_EOF'
          #!/bin/bash
          # PortMaster launch script for Smokin' Guns (RK3326 / M9 Pro)

          controlfolder="/roms/ports"
          [ -f "${controlfolder}/portmaster.sh" ] && source "${controlfolder}/portmaster.sh"

          GAMEDIR="/roms/ports/smokinguns"
          cd "$GAMEDIR" || exit 1

          export LD_LIBRARY_PATH="${GAMEDIR}/libs.aarch64:${LD_LIBRARY_PATH}"
          export LIBGL_ES=2
          export LIBGL_GL=1
          export LIBGL_NOINTOVLHACK=1
          export SDL_VIDEODRIVER=kmsdrm
          export SDL_AUDIODRIVER=alsa

          $GPTOKEYB "smokinguns.aarch64" -c "${GAMEDIR}/smokinguns.gptk" &

          LD_PRELOAD="${GAMEDIR}/libs.aarch64/libGL.so.1" \
            "${GAMEDIR}/smokinguns.aarch64" \
            +set com_hunkMegs 256 \
            +set r_mode -1 \
            +set r_customwidth 640 \
            +set r_customheight 480 \
            +set r_fullscreen 1 \
            +set fs_basepath "${GAMEDIR}" \
            +set fs_homepath "${GAMEDIR}" \
            +set fs_game smokinguns

          kill_gptokeyb
          LAUNCH_EOF
          chmod +x "$PKG/Smokin Guns.sh"

      - name: Create zip artifact
        run: |
          cd package
          zip -r "$GITHUB_WORKSPACE/${ZIP_NAME}" "Smokin Guns.sh" "${PORT_DIR}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmokinGuns-PortMaster-RK3326
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
