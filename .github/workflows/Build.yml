name: Build Smokin' Guns (aarch64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build in ARM64-Umgebung ausführen
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          
          # Paketinstallation vor dem eigentlichen Run
          setup: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential \
              gcc \
              g++ \
              make \
              ccache \
              python3 \
              libsdl1.2-dev \
              libopenal-dev \
              libcurl4-openssl-dev \
              libvorbis-dev \
              libogg-dev \
              libfreetype6-dev \
              libpng-dev \
              zlib1g-dev

          # Eigentliche Build-Schritte
          run: |
            python3 patch_build.py
            make USE_SDL2=0 ARCH=aarch64 PLATFORM=linux -j$(nproc) release

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: smokinguns-aarch64
          path: build/release-linux-aarch64/
