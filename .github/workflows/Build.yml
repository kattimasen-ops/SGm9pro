name: Build Smokin' Guns (RK3326 / ARM64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: QEMU fuer ARM64 registrieren
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Ubuntu 18.04 ARM64 Container bauen und Build ausfuehren
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            arm64v8/ubuntu:18.04 \
            bash -c "
              apt-get update || true
              apt-get install -y ca-certificates
              update-ca-certificates
              bash /work/.github/scripts/build.sh
            "

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: smokinguns-rk3326-aarch64-glibc230
          path: build-work/SmokinGuns/build/release-linux-aarch64/
          if-no-files-found: error
