name: Back mir Smokin' Guns for RK3326 (PortMaster)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-smokinguns.yml'

permissions:
  contents: read

env:
  ZIP_NAME: SmokinGuns-PortMaster-RK3326.zip
  PORT_DIR: smokinguns

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zip utility
        run: sudo apt-get update -y && sudo apt-get install -y zip

      - name: Set up QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Write in-container build script
        run: |
          mkdir -p work/src work/out/game work/out/libs.aarch64
          cat <<'BUILD_SCRIPT_EOF' > work/build.sh
          #!/bin/bash
          set -euo pipefail
          set -x
          export DEBIAN_FRONTEND=noninteractive
          export OPTIMIZE="-O2 -march=armv8-a -mcpu=cortex-a35 -mtune=cortex-a35 -pipe -fomit-frame-pointer -ffast-math"
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git pkg-config ca-certificates wget file zip python3 xxd \
            libsdl1.2-dev libsdl2-dev \
            libfreetype6-dev libjpeg-dev libpng-dev zlib1g-dev \
            libogg-dev libvorbis-dev libopus-dev libopusfile-dev \
            libcurl4-openssl-dev libopenal-dev libspeex-dev \
            libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev \
            libx11-dev libxext-dev libgl1-mesa-dev
          git config --global --add safe.directory '*'

          CMAKE_VERSION=3.28.3
          wget -q "https://cmake.org/files/v3.28/cmake-${CMAKE_VERSION}-linux-aarch64.tar.gz" -O /tmp/cmake.tar.gz
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          export PATH="/opt/cmake/bin:$PATH"
          cmake --version

          cd /work/src
          if [ ! -d gl4es ]; then git clone --depth=1 https://github.com/ptitSeb/gl4es.git; fi
          cd gl4es
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$OPTIMIZE" \
            -DNOX11=ON -DGLX_STUBS=ON -DEGL_WRAPPER=ON -DGBM=ON \
            -DSTATICLIB=OFF -DDEFAULT_ES=2
          make -j"$(nproc)"
          cd /work/src
          GL4ES_LIB="$(find /work/src/gl4es -name 'libGL.so.1' -print -quit)"
          if [ -z "$GL4ES_LIB" ]; then echo "ERROR: libGL.so.1 was not produced by the gl4es build" >&2; exit 1; fi
          cp "$GL4ES_LIB" /work/out/libs.aarch64/libGL.so.1

          cd /work/src
          if [ ! -d SmokinGuns ]; then git clone --depth=1 https://github.com/smokin-guns/SmokinGuns.git; fi
          cd SmokinGuns

          echo "==> Applying comprehensive ARM64 patches..."
          # Write Python patch script to a file to avoid quoting issues
          cat > /tmp/patch_arm64.py <<'PYTHON_EOF'
          import os

          # Patch Makefile: force architecture defines globally
          if os.path.exists("Makefile"):
              with open("Makefile", "r") as f:
                  mcontent = f.read()
              # Add global CFLAGS and renderer settings
              patch_flags = "\noverride CFLAGS += -I/usr/include/SDL -DARCH_STRING=\\\"aarch64\\\" -DQ3_LITTLE_ENDIAN -D__aarch64__=1\n"
              patch_flags += "\noverride BUILD_RENDERER_OPENGL1=1\noverride BUILD_RENDERER_OPENGL2=0\n"
              # Add defines for Q3LCC (QVM compiler)
              patch_flags += "\nQ3LCC_CFLAGS += -DARCH_STRING=\\\"aarch64\\\" -DQ3_LITTLE_ENDIAN -D__aarch64__=1\n"
              # Also force ARCH_STRING for the tools (lcc etc.)
              patch_flags += "\noverride ARCH_STRING = aarch64\n"
              with open("Makefile", "w") as f:
                  f.write(patch_flags + mcontent)
              print("[PATCHED] Makefile overrides added")

          # Patch q_platform.h files: insert __aarch64__ definition and replace #error with aarch64 case
          for root, dirs, files in os.walk("code"):
              for file in files:
                  if file == "q_platform.h":
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          lines = f.readlines()
                      
                      # Ensure __aarch64__ is defined at the top (before any include guard)
                      if not any("#ifndef __aarch64__" in line for line in lines):
                          # Insert after the first line (typically a comment or #ifndef guard)
                          # We'll insert at the beginning to guarantee it's defined.
                          lines.insert(0, "#ifndef __aarch64__\n#define __aarch64__ 1\n#endif\n")
                      
                      # Now replace the line containing #error "Architecture not supported" with a proper elif block
                      new_lines = []
                      i = 0
                      while i < len(lines):
                          line = lines[i]
                          if "#error \"Architecture not supported\"" in line:
                              # We need to replace this line with a #elif block, but we also need to ensure
                              # that there is an #else before this #error. In the original, it's:
                              # #else
                              # #error "Architecture not supported"
                              # We can just replace the #error line with a #elif block, but that won't work
                              # because #elif must be part of an #if/#elif chain. So we need to find the
                              # preceding #else line and replace both.
                              # Simpler: replace the entire block from #else to #error with aarch64 case.
                              # We'll look backwards for the #else line.
                              # We'll just replace this line with a #elif block and keep the #else after it.
                              # Actually, the original structure is:
                              # ... #if defined(...) ... #else #error "..." #endif
                              # We can change #else to #elif defined(__aarch64__) ... then leave #error after it.
                              # But we need an #else after the elif. So we'll replace the #else with:
                              # #elif defined(__aarch64__) || defined(__arm64__) || defined(aarch64)
                              # #ifndef ARCH_STRING
                              # #define ARCH_STRING "aarch64"
                              # #endif
                              # #ifndef Q3_LITTLE_ENDIAN
                              # #define Q3_LITTLE_ENDIAN
                              # #endif
                              # #else
                              # and then keep the following #error line.
                              # So we'll replace the line that starts with "#else" (before #error) with the new elif chain.
                              # Actually, we can just append a new #elif before the #else? That's tricky.
                              # Instead, we can directly replace the line that has #error with nothing, and add a new
                              # #elif block before it? Let's take a simpler approach: we'll just define __aarch64__ and
                              # also we can patch the conditional to check for __aarch64__ first. But since __aarch64__ is
                              # now defined, the existing #if chain might already have a branch for it. If not, we can
                              # just replace the #else with a #elif that matches __aarch64__ and then re-add #else.
                              # We'll modify the line that contains "#else" that is immediately before the #error.
                              # We'll detect the pattern: if we see a line starting with "#else" and the next line contains "#error \"Architecture not supported\"",
                              # we replace that "#else" line with the aarch64 elif block and keep the #error as #else.
                              # But that requires looking ahead.
                              # We'll implement a simpler method: find the index of the line containing #error "Architecture not supported".
                              # Then look backwards for the nearest line starting with "#else". Replace that line with the elif block.
                              # We'll do this by scanning and modifying.
                              # For now, we'll do a global replacement of the entire #else block.
                              # Actually, we can replace the line containing #error with nothing, and also replace the previous #else with a #elif.
                              # Let's do a more direct approach: read the whole content, then use string replace.
                              # Since we are processing line-by-line, we'll collect all lines and then do a replacement on the whole text.
                              # We'll switch to string-based method.
                              pass
                      # This loop is incomplete; instead, we'll handle at the end.
                      # Let's fallback to a string replace on the whole content.
                      # Re-read the whole content and do a simple replace.
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      # Add __aarch64__ definition if not present
                      if "#ifndef __aarch64__" not in content:
                          content = "#ifndef __aarch64__\n#define __aarch64__ 1\n#endif\n" + content
                      # Replace the exact string "#else\n#error \"Architecture not supported\"" with the aarch64 block
                      # This pattern works if the lines are exactly "#else" and next line "#error "Architecture not supported""
                      # with possible spaces. We'll use a simple replace.
                      old = '#else\n#error "Architecture not supported"'
                      new = (
                          '#elif defined(__aarch64__) || defined(__arm64__) || defined(aarch64)\n'
                          '#ifndef ARCH_STRING\n'
                          '#define ARCH_STRING "aarch64"\n'
                          '#endif\n'
                          '#ifndef Q3_LITTLE_ENDIAN\n'
                          '#define Q3_LITTLE_ENDIAN\n'
                          '#endif\n'
                          '#else\n'
                          '#error "Architecture not supported"'
                      )
                      if old in content:
                          content = content.replace(old, new)
                      else:
                          # Try alternative: maybe there's a space or different spacing
                          # If not found, just replace the #error line with a harmless define? 
                          # We'll just replace the #error line with an empty or a #elif? 
                          # Actually, we can prepend a #if defined(__aarch64__) block before the #else? 
                          # For safety, we'll replace all occurrences of '#error "Architecture not supported"' with '#elif defined(__aarch64__)\n#define ARCH_STRING "aarch64"\n#define Q3_LITTLE_ENDIAN\n#else\n#error "Architecture not supported"'
                          content = content.replace('#error "Architecture not supported"', 
                              '#elif defined(__aarch64__) || defined(__arm64__) || defined(aarch64)\n'
                              '#ifndef ARCH_STRING\n#define ARCH_STRING "aarch64"\n#endif\n'
                              '#ifndef Q3_LITTLE_ENDIAN\n#define Q3_LITTLE_ENDIAN\n#endif\n'
                              '#else\n#error "Architecture not supported"')
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(content)
                      print(f"[PATCHED] {filepath}")
          PYTHON_EOF
          python3 /tmp/patch_arm64.py

          # Now run make with correct variables
          make -j"$(nproc)" V=1 PLATFORM=linux ARCH=aarch64 CC=gcc \
            BUILD_STANDALONE=1 BUILD_GAME_QVM=1 BUILD_GAME_SO=0 BUILD_SERVER=0 \
            USE_OPENAL=0 USE_CODEC_VORBIS=0 USE_CURL=0 USE_MUMBLE=0 USE_VOIP=0 \
            USE_INTERNAL_ZLIB=1 USE_INTERNAL_SPEEX=1 USE_LOCAL_HEADERS=0 \
            BUILD_RENDERER_OPENGL1=1 BUILD_RENDERER_OPENGL2=0 \
            OPTIMIZE="$OPTIMIZE"

          BUILD_OUT="$(find /work/src/SmokinGuns/build -maxdepth 1 -type d -name 'release-linux-aarch64' -print -quit)"
          if [ -z "$BUILD_OUT" ]; then echo "ERROR: could not locate SmokinGuns build output directory" >&2; find /work/src/SmokinGuns/build -maxdepth 1 -type d >&2 || true; exit 1; fi

          CLIENT_BIN="$(find "$BUILD_OUT" -maxdepth 1 -type f -executable ! -name '*.so' -print -quit)"
          if [ -z "$CLIENT_BIN" ]; then echo "ERROR: could not locate the compiled client binary in $BUILD_OUT" >&2; ls -la "$BUILD_OUT" >&2 || true; exit 1; fi
          cp "$CLIENT_BIN" /work/out/game/smokinguns.aarch64
          chmod +x /work/out/game/smokinguns.aarch64

          find "$BUILD_OUT" -maxdepth 1 -name '*.so' -exec cp {} /work/out/game/ \; || true

          VM_DIR="$(find /work/src/SmokinGuns/build -type d -name vm -print -quit)"
          if [ -n "$VM_DIR" ]; then
            ( cd "$(dirname "$VM_DIR")" && zip -r /work/out/game/z_vm.pk3 vm )
            echo "Packed QVM game logic into z_vm.pk3 (from $VM_DIR)"
          else
            echo "ERROR: no vm/ directory found - z_vm.pk3 was NOT created!" >&2
            exit 1
          fi

          file /work/out/game/smokinguns.aarch64
          file /work/out/libs.aarch64/libGL.so.1
          echo "Build finished successfully."
          BUILD_SCRIPT_EOF
          chmod +x work/build.sh

      - name: Build inside Ubuntu 20.04 aarch64 container (glibc 2.31)
        run: |
          docker run --rm --platform linux/arm64 -v "${{ github.workspace }}/work":/work -w /work ubuntu:20.04 bash /work/build.sh

      - name: Assemble PortMaster package
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/package"
          rm -rf "$PKG"
          mkdir -p "$PKG/${PORT_DIR}/libs.aarch64"
          mkdir -p "$PKG/${PORT_DIR}/${PORT_DIR}"

          cp work/out/game/smokinguns.aarch64 "$PKG/${PORT_DIR}/smokinguns.aarch64"
          chmod +x "$PKG/${PORT_DIR}/smokinguns.aarch64"
          find work/out/game -maxdepth 1 -name '*.so' -exec cp {} "$PKG/${PORT_DIR}/" \; || true

          if [ -f work/out/game/z_vm.pk3 ]; then
            cp work/out/game/z_vm.pk3 "$PKG/${PORT_DIR}/${PORT_DIR}/z_vm.pk3"
          else
            echo "ERROR: z_vm.pk3 missing!" >&2
            exit 1
          fi

          cp work/out/libs.aarch64/libGL.so.1 "$PKG/${PORT_DIR}/libs.aarch64/libGL.so.1"

          cat > "$PKG/${PORT_DIR}/${PORT_DIR}/PUT_YOUR_PK3_FILES_HERE.txt" <<'PLACEHOLDER_EOF'
          Copy your own legally obtained Smokin' Guns .pk3 data files
          (e.g. sg_pak0.pk3) into this folder before launching the port.
          PLACEHOLDER_EOF

          cat > "$PKG/${PORT_DIR}/smokinguns.gptk" <<'GPTK_EOF'
          [ANALOG1]
          UP = W
          DOWN = S
          LEFT = A
          RIGHT = D

          [ANALOG2]
          UP = mouse_move_up
          DOWN = mouse_move_down
          LEFT = mouse_move_left
          RIGHT = mouse_move_right

          [BUTTONS]
          A = mouse_left
          B = mouse_right
          X = SPACE
          Y = R
          L1 = TAB
          R1 = mouse_middle
          L2 = Q
          R2 = E
          START = ESCAPE
          SELECT = F1
          L3 = LEFTSHIFT
          R3 = C
          UP = UP
          DOWN = DOWN
          LEFT = LEFT
          RIGHT = RIGHT
          GPTK_EOF

          cat > "$PKG/${PORT_DIR}/port.json" <<'PORTJSON_EOF'
          {
            "version": 2,
            "name": "Smokin Guns.sh",
            "items": [
              "Smokin Guns.sh"
            ],
            "items_opt": [],
            "attr": {
              "title": "Smokin' Guns",
              "porter": "community",
              "desc": "Standalone western-themed FPS built on the ioquake3 engine, using GL4ES to run on OpenGL ES 2.0 hardware.",
              "genres": [
                "fps",
                "shooter"
              ],
              "porter_wallet": "",
              "image": {
                "screenshot": ""
              },
              "rtr": false
            }
          }
          PORTJSON_EOF

          cat > "$PKG/${PORT_DIR}/README.md" <<'README_EOF'
          # Smokin' Guns - PortMaster (RK3326 / M9 Pro)

          This port ships the compiled aarch64 engine binary, the QVM game
          logic (z_vm.pk3), and the GL4ES translation layer. Copyrighted game
          data is NOT included and must be supplied by you.

          ## Required files

          Copy your own legally obtained sg_pak0.pk3 (and any optional fan
          packs, such as included_fanpak0.pk3) into:

              smokinguns/smokinguns/

          Final on-device layout:

              smokinguns/
              |-- smokinguns.aarch64
              |-- smokinguns.gptk
              |-- port.json
              |-- libs.aarch64/
              |   `-- libGL.so.1
              `-- smokinguns/
                  |-- z_vm.pk3
                  `-- sg_pak0.pk3

          ## Technical notes

          - Rendering goes through GL4ES (GBM/EGL backend, no X11) to
            translate the engine's desktop OpenGL calls into the Mali-G31's
            native OpenGL ES 2.0.
          - com_hunkMegs is capped at 256 in the launch script to keep the
            Linux OOM killer from terminating the game on this 1GB-RAM
            device.
          - Controls are mapped with gptokeyb using smokinguns.gptk; the
            left stick moves (WASD), the right stick drives the mouse look.
          README_EOF

          cat > "$PKG/Smokin Guns.sh" <<'LAUNCH_EOF'
          #!/bin/bash
          # PortMaster launch script for Smokin' Guns (RK3326 / M9 Pro)

          controlfolder="/roms/ports"
          [ -f "${controlfolder}/portmaster.sh" ] && source "${controlfolder}/portmaster.sh"

          GAMEDIR="/roms/ports/smokinguns"
          cd "$GAMEDIR" || exit 1

          export LD_LIBRARY_PATH="${GAMEDIR}/libs.aarch64:${LD_LIBRARY_PATH}"
          export LIBGL_ES=2
          export LIBGL_GL=1
          export LIBGL_NOINTOVLHACK=1
          export SDL_VIDEODRIVER=kmsdrm
          export SDL_AUDIODRIVER=alsa

          $GPTOKEYB "smokinguns.aarch64" -c "${GAMEDIR}/smokinguns.gptk" &

          LD_PRELOAD="${GAMEDIR}/libs.aarch64/libGL.so.1" \
            "${GAMEDIR}/smokinguns.aarch64" \
            +set com_hunkMegs 256 \
            +set r_mode -1 \
            +set r_customwidth 640 \
            +set r_customheight 480 \
            +set r_fullscreen 1 \
            +set fs_basepath "${GAMEDIR}" \
            +set fs_homepath "${GAMEDIR}" \
            +set fs_game smokinguns

          kill_gptokeyb
          LAUNCH_EOF
          chmod +x "$PKG/Smokin Guns.sh"

      - name: Create zip artifact
        run: |
          cd package
          zip -r "$GITHUB_WORKSPACE/${ZIP_NAME}" "Smokin Guns.sh" "${PORT_DIR}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmokinGuns-PortMaster-RK3326
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
