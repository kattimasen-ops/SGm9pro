name: Create Smokin Guns ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Clone Official Smokin' Guns Source Code
        run: |
          git clone --depth=1 https://github.com/smokin-guns/SmokinGuns.git temp_source
          cp -r temp_source/* .
          cp -r temp_source/.github . 2>/dev/null || true
          rm -rf temp_source

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Cache ccache directory
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-aarch64-${{ github.sha }}
          restore-keys: |
            ccache-aarch64-

      - name: Build inside ARM64 Docker Container
        timeout-minutes: 120
        run: |
          mkdir -p .ccache
          docker run --rm --privileged --platform linux/arm64 \
            -v ${{ github.workspace }}:/work \
            -v ${{ github.workspace }}/.ccache:/root/.ccache \
            -e CC="ccache gcc" \
            -e TERM="dumb" \
            arm64v8/ubuntu:20.04 bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y \
              build-essential python3 python3-pip git \
              libsdl2-dev libopenal-dev libcurl4-openssl-dev \
              python3-urllib3 ccache pkg-config cmake

            echo '===== SDL2 DIAGNOSTICS ====='
            echo '--- sdl2-config --version ---'
            sdl2-config --version 2>&1 || echo 'sdl2-config NOT FOUND'
            echo '--- sdl2-config --cflags ---'
            sdl2-config --cflags 2>&1 || echo 'sdl2-config --cflags FAILED'
            echo '--- sdl2-config --libs ---'
            sdl2-config --libs 2>&1 || echo 'sdl2-config --libs FAILED'
            echo '--- SDL2 header location ---'
            ls -la /usr/include/SDL2/SDL.h 2>&1 || echo 'SDL2 header NOT FOUND'
            echo '===== END SDL2 DIAGNOSTICS ====='

            ccache -M 2G
            cd /work
            python3 .github/scripts/patch_arm64.py
          "

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smokinguns-arm64
          path: build/release-linux-aarch64/
          retention-days: 30 
